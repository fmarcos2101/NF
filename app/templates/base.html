<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ titulo }} — Sistema NF</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <aside class="sidebar">
    <div class="logo">NF<span>Sistema de Notas Fiscais</span></div>
    <nav>
      <a href="/">Início</a>
      <a href="/notas">Notas fiscais</a>
      <a href="/clientes">Clientes</a>
      <a href="/produtos">Produtos</a>
      <a href="/contabilidade">Contabilidade</a>
      <a href="/configuracoes">Configurações</a>
    </nav>
    <div class="status-box" id="status-box">Verificando conexão...</div>
    <button type="button" class="sair" id="btn-sair" style="display:none" onclick="sair()">Sair</button>
  </aside>
  <main>
    <header>
      <h1>{{ titulo }}</h1>
      <div id="acoes-cabecalho">{% block acoes %}{% endblock %}</div>
    </header>
    <section class="content">
      {% block conteudo %}{% endblock %}
    </section>
  </main>
  <div id="toast"></div>
  <script src="/static/app.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
