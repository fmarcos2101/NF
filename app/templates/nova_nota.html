{% extends "base.html" %}

{% block conteudo %}
<div class="painel">
  <h2>Destinatário</h2>
  <div class="form-grid">
    <div class="c8">
      <label>Cliente *</label>
      <select id="cliente"><option value="">Selecione o cliente...</option></select>
    </div>
    <div class="c4" style="display:flex;align-items:flex-end">
      <a class="btn secundario" href="/clientes">Cadastrar cliente</a>
    </div>
  </div>
</div>

<div class="painel">
  <h2>Itens da nota</h2>
  <table>
    <thead>
      <tr><th style="width:40%">Produto</th><th>Qtde</th><th>Preço unit. (R$)</th><th>Subtotal</th><th></th></tr>
    </thead>
    <tbody id="itens"></tbody>
  </table>
  <div style="margin-top:12px">
    <button class="btn secundario" onclick="adicionarItem()">+ Adicionar item</button>
  </div>
</div>

<div class="painel">
  <div class="form-grid">
    <div class="c4"><label>Desconto (R$)</label>
      <input id="desconto" type="number" step="0.01" min="0" value="0"></div>
    <div class="c8"><label>Observações (informações complementares)</label>
      <input id="observacoes"></div>
    <div class="c12 total-nota">Total: <span id="total">R$ 0,00</span></div>
  </div>
</div>

<div class="barra-acoes">
  <div class="espaco"></div>
  <button class="btn secundario" onclick="salvar(false)">Salvar rascunho</button>
  <button class="btn" onclick="salvar(true)">Emitir nota</button>
</div>
{% endblock %}

{% block scripts %}
<script>
let produtos = [];
const editandoId = parseInt(new URLSearchParams(location.search).get("editar") || "0");

async function iniciar() {
  const [clientes, prods] = await Promise.all([
    api("/api/clientes"),
    api("/api/produtos"),
  ]);
  produtos = prods;
  const select = document.getElementById("cliente");
  clientes.forEach((c) => {
    const opcao = document.createElement("option");
    opcao.value = c.id;
    opcao.textContent = c.cpf_cnpj ? `${c.nome} — ${c.cpf_cnpj}` : c.nome;
    select.appendChild(opcao);
  });
  if (editandoId) {
    await carregarParaEdicao();
  } else {
    adicionarItem();
  }
}

async function carregarParaEdicao() {
  try {
    const nota = await api(`/api/notas/${editandoId}`);
    document.querySelector("main > header h1").textContent =
      `Corrigir nota ${nota.numero ? String(nota.numero).padStart(6, "0") : "(rascunho)"}`;
    document.getElementById("cliente").value = nota.cliente_id || "";
    document.getElementById("desconto").value = nota.desconto || 0;
    document.getElementById("observacoes").value = nota.observacoes || "";
    (nota.itens || []).forEach((item) => {
      adicionarItem();
      const linha = document.querySelector("#itens tr:last-child");
      const selectProduto = linha.querySelector(".produto");
      selectProduto.value = item.produto_id || "";
      linha.querySelector(".quantidade").value = item.quantidade;
      linha.querySelector(".preco").value = item.preco_unitario;
    });
    if (!(nota.itens || []).length) adicionarItem();
    recalcular();
    if (nota.motivo_rejeicao) {
      toast(`Motivo da rejeição: ${nota.motivo_rejeicao}`, "erro");
    }
  } catch (erro) {
    toast(erro.message, "erro");
    adicionarItem();
  }
}

function adicionarItem() {
  const linha = document.createElement("tr");
  const opcoes = produtos.map((p) =>
    `<option value="${p.id}" data-preco="${p.preco}">${escapeHtml(p.descricao)}</option>`
  ).join("");
  linha.innerHTML = `
    <td><select class="produto"><option value="">Selecione...</option>${opcoes}</select></td>
    <td><input class="quantidade" type="number" step="0.001" min="0.001" value="1"></td>
    <td><input class="preco" type="number" step="0.01" min="0" value="0"></td>
    <td class="subtotal">R$ 0,00</td>
    <td class="acoes"><button class="btn mini perigo" onclick="this.closest('tr').remove(); recalcular()">Remover</button></td>`;
  linha.querySelector(".produto").addEventListener("change", (ev) => {
    const opcao = ev.target.selectedOptions[0];
    linha.querySelector(".preco").value = opcao.dataset.preco || 0;
    recalcular();
  });
  linha.querySelectorAll(".quantidade, .preco").forEach((campo) =>
    campo.addEventListener("input", recalcular));
  document.getElementById("itens").appendChild(linha);
}

function lerItens() {
  return [...document.querySelectorAll("#itens tr")].map((linha) => ({
    produto_id: parseInt(linha.querySelector(".produto").value || "0"),
    quantidade: parseFloat(linha.querySelector(".quantidade").value || "0"),
    preco_unitario: parseFloat(linha.querySelector(".preco").value || "0"),
    linha,
  }));
}

function recalcular() {
  let total = 0;
  lerItens().forEach((item) => {
    const subtotal = item.quantidade * item.preco_unitario;
    total += subtotal;
    item.linha.querySelector(".subtotal").textContent = dinheiro(subtotal);
  });
  total -= parseFloat(document.getElementById("desconto").value || "0");
  document.getElementById("total").textContent = dinheiro(Math.max(total, 0));
}

async function salvar(emitirAgora) {
  const clienteId = parseInt(document.getElementById("cliente").value || "0");
  if (!clienteId) return toast("Selecione o cliente.", "erro");
  const itens = lerItens().filter((i) => i.produto_id > 0);
  if (!itens.length) return toast("Adicione ao menos um item com produto selecionado.", "erro");

  try {
    const corpo = {
      cliente_id: clienteId,
      itens: itens.map(({ linha, ...item }) => item),
      desconto: parseFloat(document.getElementById("desconto").value || "0"),
      observacoes: document.getElementById("observacoes").value,
      emitir_agora: emitirAgora,
    };
    const nota = editandoId
      ? await api(`/api/notas/${editandoId}`, { method: "PUT", body: corpo })
      : await api("/api/notas", { method: "POST", body: corpo });
    if (emitirAgora) {
      await api("/api/notas/processar-fila", { method: "POST" });
      toast(`Nota nº ${nota.numero} enviada para emissão. Se estiver off-line, ela fica na fila.`, "ok");
    } else {
      toast("Rascunho salvo (o número fiscal é reservado na emissão).", "ok");
    }
    setTimeout(() => (location.href = "/notas"), 900);
  } catch (erro) {
    toast(erro.message, "erro");
  }
}

document.getElementById("desconto").addEventListener("input", recalcular);
iniciar();
</script>
{% endblock %}
